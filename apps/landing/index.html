<!doctype html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Sinkroo — Tu equipo de marketing, trabajando solo 24/7</title>
    <meta name="description" content="Investiga su mercado, escribe las piezas, las prueba con quinientas personas simuladas y cinco jueces, y mide cada peso. El trabajo queda hecho: sólo queda aprobar." />
    <meta name="theme-color" content="#000000" />

    <!-- CÓMO SE VE EL ENLACE CUANDO LO COMPARTEN (WhatsApp, Facebook, X): el búho, el nombre y la
         misma promesa que dice la página. El sitio viejo traía estas etiquetas en inglés y con una
         imagen que ya no existe (/assets/logo.png), así que el enlace salía sin vista previa. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://sinkroo.com/" />
    <meta property="og:site_name" content="Sinkroo" />
    <meta property="og:locale" content="es_CO" />
    <meta property="og:title" content="Sinkroo — Tu equipo de marketing, trabajando solo 24/7" />
    <meta property="og:description" content="Investiga su mercado, escribe las piezas, las prueba con quinientas personas simuladas y cinco jueces, y mide cada peso. El trabajo queda hecho: sólo queda aprobar." />
    <meta property="og:image" content="https://sinkroo.com/67.png" />
    <meta property="og:image:alt" content="Sinkroo: el búho" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Sinkroo — Tu equipo de marketing, trabajando solo 24/7" />
    <meta name="twitter:description" content="Investiga su mercado, escribe las piezas, las prueba con quinientas personas simuladas y cinco jueces, y mide cada peso. El trabajo queda hecho: sólo queda aprobar." />
    <meta name="twitter:image" content="https://sinkroo.com/67.png" />

    <!-- El búho: los mismos iconos que usa el panel, con los mismos nombres y rutas absolutas
         (base '/'). El .ico trae los tres tamaños dentro; los .png son para los navegadores que
         piden un tamaño exacto; el de 180 es el que usa iOS al mandar la página a la pantalla
         de inicio. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- La misma tipografía del panel (Inter). Se carga aparte y con `media="print"` para que la
         página se pueda leer de una: si la fuente no llega (sin internet, por ejemplo) queda la
         del sistema y el texto se ve igual. Nada de esto esconde contenido. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap"
      media="print"
      onload="this.media='all'"
    />
  </head>
  <body>
    <!-- Aquí NO va ningún «watchdog anti-blank»: nada se destapa por JavaScript. El texto de la
         página no arranca escondido, así que no hay nada que rescatar a los 6 segundos. -->
    <div id="root">
      <noscript>
        <p style="font-family: system-ui, sans-serif; color: #f5f5f5; background: #000; padding: 24px; margin: 0">
          Sinkroo — Tu equipo de marketing, trabajando solo 24/7. Esta página necesita JavaScript
          para mostrarse completa. <a href="/panel/" style="color: #c084fc">Entrar a mi panel</a>
        </p>
      </noscript>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
